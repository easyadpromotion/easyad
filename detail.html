<script>
/* ============================================================
   SHARED HELPERS — used by every page in the admin dashboard app
   Real data from Supabase (`campaigns`, `users`, `user_ad_history`).
   There's no state/district data anywhere in the schema — users and
   campaigns store a free-text city, not a state — so unlike the old
   mock version this can only show one honest All-India total per
   metric, not a per-state breakdown.
   ============================================================ */

const PERIODS = ["Day", "Week", "Month", "Half Yearly", "Yearly", "Date Range"];

/* ---- turn a period label into a real [from, to] date range.
   from === null means "all time" (used for Total/Active boxes below,
   which are intentionally NOT period-scoped — see refresh()). ---- */
function periodRange(period, customFrom, customTo){
  const to = (period === "Date Range" && customTo) ? new Date(customTo + "T23:59:59") : new Date();
  const days = { "Day":1, "Week":7, "Month":30, "Half Yearly":182, "Yearly":365 }[period];
  let from = null;
  if(period === "Date Range"){
    from = customFrom ? new Date(customFrom + "T00:00:00") : null;
  } else if(days){
    from = new Date(to.getTime() - days*24*60*60*1000);
  }
  return { from, to };
}

/* ---- bucket {date, value} points into N equal sub-intervals of
   [from, to], summing value per bucket. Powers the trend chart with
   real data instead of random numbers. ---- */
function bucketize(points, from, to, n){
  n = n || 6;
  const start = (from || new Date(Math.min(to.getTime(), ...points.map(p=>p.date.getTime())))).getTime();
  const end = to.getTime();
  const bucketMs = Math.max(end - start, 1) / n;
  const buckets = new Array(n).fill(0);
  points.forEach(p=>{
    const t = p.date.getTime();
    if(t < start || t > end) return;
    let idx = Math.floor((t - start) / bucketMs);
    if(idx >= n) idx = n - 1;
    if(idx < 0) idx = 0;
    buckets[idx] += p.value;
  });
  return buckets;
}

/* ============================================================
   REAL STATE RESOLUTION — neither `users` nor `campaigns` stores a
   state, only lat/lng (and a free-text city). To restore a genuine
   per-state list instead of the old fabricated one, each unique
   coordinate is reverse-geocoded via OpenStreetMap Nominatim — the
   same free, key-less API home.html already uses for city detection
   — and cached so repeat coordinates (common — many rows cluster in
   the same city) cost one network call, not one per row. Calls are
   spaced ~1.1s apart to stay within Nominatim's usage policy.
   ============================================================ */
const stateCache = new Map();
let lastGeocodeAt = 0;
async function resolveState(lat, lng){
  if(lat == null || lng == null) return "Unspecified";
  const key = lat.toFixed(2) + "," + lng.toFixed(2);
  if(stateCache.has(key)) return stateCache.get(key);
  const wait = Math.max(0, 1100 - (Date.now() - lastGeocodeAt));
  if(wait) await new Promise(r => setTimeout(r, wait));
  lastGeocodeAt = Date.now();
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=8&addressdetails=1`);
    const data = await res.json();
    const state = (data.address && data.address.state) || "Unspecified";
    stateCache.set(key, state);
    return state;
  }catch(e){
    console.error('resolveState error:', e);
    stateCache.set(key, "Unspecified");
    return "Unspecified";
  }
}

/* ---- distinct id count per state, e.g. distinct vendors/users — a
   vendor with campaigns in two states legitimately counts in both. ---- */
async function bucketDistinctByState(items){
  const stateSets = {};
  for(const it of items){
    const state = await resolveState(it.lat, it.lng);
    (stateSets[state] || (stateSets[state] = new Set())).add(it.id);
  }
  const out = {};
  Object.keys(stateSets).forEach(s => out[s] = stateSets[s].size);
  return out;
}

/* ---- summed value per state, e.g. revenue ---- */
async function bucketSumByState(items){
  const out = {};
  for(const it of items){
    const state = await resolveState(it.lat, it.lng);
    out[state] = (out[state] || 0) + it.value;
  }
  return out;
}

/* ---- render a real Pan-India state list for one metric, with a
   "Show All State Names" expander and a click-through link per state.
   state_detail.html's vendor/company/user branches are real (not mock),
   and now also compute a real district/urban-rural tree, so linking
   there is safe again. ---- */
function renderStateList(container, title, indiaTotal, stateMap, isCurrency, linkBuilder){
  const fmt = (v) => isCurrency ? "₹" + v.toLocaleString(undefined, {maximumFractionDigits:2}) : v.toLocaleString();
  const list = Object.entries(stateMap).map(([state, value]) => ({ state, value })).sort((a,b)=> b.value - a.value);
  const collapsedCount = 5;
  let expanded = false;

  function paint(){
    const shown = expanded ? list : list.slice(0, collapsedCount);
    container.innerHTML = `
      <div class="metric-head"><h5>${title}</h5><span class="metric-total">${fmt(indiaTotal)}</span></div>
      <div class="state-list">
        ${shown.length ? shown.map(s => `
          <a class="state-row" href="${linkBuilder(s.state)}">
            <span class="state-name">${s.state}</span>
            <span class="state-val">${fmt(s.value)}</span>
            <span class="state-arrow">›</span>
          </a>`).join("") : `<div class="state-row"><span class="state-name">No data yet</span></div>`}
      </div>
      ${list.length > collapsedCount ? `<button class="show-all-btn" id="toggle-${CSS.escape(title)}">${expanded ? "Show less" : `Show All State Names (${list.length})`}</button>` : ""}
    `;
    if(list.length > collapsedCount){
      document.getElementById(`toggle-${CSS.escape(title)}`).onclick = ()=>{ expanded = !expanded; paint(); };
    }
  }
  paint();
}

/* ---- period selector chips + date range inputs ----
   container: element to render chips into
   onChange(period): callback fired with the chosen period label */
function initPeriodSelector(container, onChange, dateRangeContainer){
  container.innerHTML = "";
  PERIODS.forEach((p, i)=>{
    const chip = document.createElement("button");
    chip.className = "period-chip" + (i===2 ? " active" : "");
    chip.textContent = p;
    chip.onclick = ()=>{
      [...container.children].forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      if(dateRangeContainer){
        dateRangeContainer.classList.toggle("show", p === "Date Range");
      }
      onChange(p);
    };
    container.appendChild(chip);
  });
  return "Month"; // default selected period
}

/* ============================================================
   DEPENDENCY-FREE TREND CHART — plain inline SVG bars, no
   external chart library, so it always renders even when a page
   is previewed offline or a CDN script is blocked. Fed real
   bucketed counts (see bucketize() above), one series only —
   there's a single real signal per revenue type, not three.
   ============================================================ */
function renderTrendChart(containerId, buckets, label, color){
  const container = document.getElementById(containerId);
  if(!container) return;
  const maxV = Math.max(...buckets, 1);

  const W = 300, H = 150, padL = 6, padB = 6, padT = 10;
  const groupW = (W - padL) / buckets.length;
  const barW = groupW - 6;

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;">`;
  buckets.forEach((val, i)=>{
    const bh = (val / maxV) * (H - padT - padB);
    const x = padL + i*groupW + 3;
    const y = H - padB - bh;
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}"/>`;
  });
  svg += `</svg>`;
  container.innerHTML = svg;

  const legendEl = document.getElementById(containerId + "-legend");
  if(legendEl){
    legendEl.innerHTML = `<div class="legend-item"><span class="legend-dot" style="background:${color}"></span>${label}</div>`;
  }
}

/* ---- CSV export ---- */
function downloadCSV(filename, headers, rows){
  let csv = headers.join(",") + "\n";
  rows.forEach(r=>{ csv += r.map(v => typeof v === "string" && v.includes(",") ? `"${v}"` : v).join(",") + "\n"; });
  const blob = new Blob([csv], { type:"text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---- read a query-string param ---- */
function qParam(name, fallback){
  const v = new URLSearchParams(window.location.search).get(name);
  return v || fallback;
}

/* ---- reusable app logo (inline SVG so no external image needed) ---- */
function logoSVG(size){
  size = size || 32;
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6c3ce9"/>
    </linearGradient></defs>
    <path d="M20 2 L36 9 V19 C36 29 29.5 36 20 39 C10.5 36 4 29 4 19 V9 Z" fill="url(#lg)"/>
    <path d="M13 20.5 L18 25.5 L27 15" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>`;
}

</script>
<script>
document.getElementById("logoSlot").innerHTML = logoSVG(28);

// "Highest Earning Users" has no official product definition yet — this
// takes it to mean the top 20% of users who've earned anything at all,
// by wallet balance. Swap for a real business rule (e.g. a fixed rupee
// threshold) once the product owner defines one.
const HIGH_EARNER_PERCENTILE = 0.8;

const CONFIG = {
  vendor: {
    title: "Vendor",
    subtitle: "Revenue > Vendor",
    boxes: [
      { title: "Total Vendors", key: "totalVendors" },
      { title: "Active Vendors", key: "activeVendors" },
      { title: "New Added Vendors", key: "newVendors" }
    ]
  },
  user: {
    title: "User Earning",
    subtitle: "Revenue > User",
    boxes: [
      { title: "Total Earning Users", key: "totalEarningUsers" },
      { title: "Highest Earning Users", key: "highestEarningUsers" },
      { title: "Newly Added Earning Users", key: "newEarningUsers" }
    ]
  },
  company: {
    title: "Company",
    subtitle: "Revenue > Company",
    boxes: [
      { title: "Total Company Revenue", key: "totalCompanyRevenue", isCurrency: true },
      { title: "Active Revenue Streams", key: "activeCompanyRevenue", isCurrency: true },
      { title: "New Revenue Sources", key: "newCompanyRevenue", isCurrency: true }
    ]
  }
};

const type = qParam("type", "vendor");
const cfg = CONFIG[type] || CONFIG.vendor;

document.getElementById("pageTitle").textContent = cfg.title;
document.getElementById("pageSubtitle").textContent = cfg.subtitle;
document.getElementById("chartTitle").textContent = cfg.title + " Trend";
document.title = cfg.title + " • Revenue Detail";

document.getElementById("historyBtn").onclick = ()=> window.location.href = "history.html?type=" + type;
document.getElementById("statementBtn").onclick = ()=> window.location.href = "statement.html?type=" + type;

let currentPeriod = "Month";
const periodRow = document.getElementById("periodRow");
const dateRangeRow = document.getElementById("dateRangeRow");
const boxGrid = document.getElementById("boxGrid");
const dateFromInput = document.getElementById("dateFrom");
const dateToInput = document.getElementById("dateTo");

boxGrid.innerHTML = cfg.boxes.map(b =>
  `<div class="data-box" id="box-${b.key}"><div class="metric-head"><h5>${b.title}</h5><span class="metric-total">Loading…</span></div></div>`
).join("");

let lastResult = null; // cached for the Download button

/* ---- real Supabase-backed metrics, one loader per revenue type.
   Total/Active are intentionally all-time (a "currently active" snapshot
   shouldn't jump around as you change the period filter) — only New and
   the trend chart are scoped to the selected period. ---- */

async function loadVendorMetrics(from, to){
  // Vendors have no stored address of their own (no vendors table at
  // all) — state here comes from each CAMPAIGN's target location, i.e.
  // "where this vendor's ads are aimed", not "where the vendor lives".
  const { data, error } = await supabaseClient.from('campaigns').select('vendor_mobile, status, created_at, lat, lng');
  if(error){ console.error('loadVendorMetrics error:', error); return null; }
  const rows = (data || []).filter(r => r.vendor_mobile);

  const totalVendors = new Set(rows.map(r=>r.vendor_mobile)).size;
  const activeRows = rows.filter(r=>r.status === 'Active');
  const activeVendors = new Set(activeRows.map(r=>r.vendor_mobile)).size;

  const firstRowByVendor = {};
  rows.forEach(r=>{
    const cur = firstRowByVendor[r.vendor_mobile];
    if(!cur || new Date(r.created_at) < new Date(cur.created_at)) firstRowByVendor[r.vendor_mobile] = r;
  });
  const newRows = Object.values(firstRowByVendor).filter(r=>{
    const t = new Date(r.created_at).getTime();
    return (!from || t >= from.getTime()) && t <= to.getTime();
  });

  const [totalStates, activeStates, newStates] = await Promise.all([
    bucketDistinctByState(rows.map(r=>({ lat:r.lat, lng:r.lng, id:r.vendor_mobile }))),
    bucketDistinctByState(activeRows.map(r=>({ lat:r.lat, lng:r.lng, id:r.vendor_mobile }))),
    bucketDistinctByState(newRows.map(r=>({ lat:r.lat, lng:r.lng, id:r.vendor_mobile })))
  ]);

  const trend = bucketize(rows.map(r=>({ date: new Date(r.created_at), value: 1 })), from, to);
  return {
    values: { totalVendors, activeVendors, newVendors: newRows.length },
    stateBreakdown: { totalVendors: totalStates, activeVendors: activeStates, newVendors: newStates },
    trend, trendLabel: "New vendors", trendColor: "#6c3ce9"
  };
}

async function loadUserMetrics(from, to){
  // State comes from the user's OWN detected lat/lng (users.lat/lng,
  // written by home.html's GPS location step) — a genuine home location,
  // unlike the vendor/company loaders which only have a target location.
  const [usersRes, historyRes] = await Promise.all([
    supabaseClient.from('users').select('mobile, wallet, lat, lng'),
    supabaseClient.from('user_ad_history').select('user_mobile, amount, created_at')
  ]);
  if(usersRes.error){ console.error('loadUserMetrics users error:', usersRes.error); return null; }
  if(historyRes.error){ console.error('loadUserMetrics history error:', historyRes.error); }

  const users = usersRes.data || [];
  const history = historyRes.data || [];
  const userByMobile = {};
  users.forEach(u => userByMobile[u.mobile] = u);

  const earners = users.filter(u => (u.wallet || 0) > 0);
  const sortedWallets = earners.map(u=>u.wallet).sort((a,b)=>a-b);
  const cutoff = sortedWallets.length ? sortedWallets[Math.floor(sortedWallets.length * HIGH_EARNER_PERCENTILE)] : Infinity;
  const highestEarners = earners.filter(u => u.wallet >= cutoff);

  const firstEarned = {};
  history.forEach(r=>{
    if(!(r.amount > 0)) return;
    const t = new Date(r.created_at).getTime();
    if(!(r.user_mobile in firstEarned) || t < firstEarned[r.user_mobile]) firstEarned[r.user_mobile] = t;
  });
  const newEarnerMobiles = Object.keys(firstEarned).filter(m => {
    const t = firstEarned[m];
    return (!from || t >= from.getTime()) && t <= to.getTime();
  });

  const [totalStates, highestStates, newStates] = await Promise.all([
    bucketDistinctByState(earners.map(u=>({ lat:u.lat, lng:u.lng, id:u.mobile }))),
    bucketDistinctByState(highestEarners.map(u=>({ lat:u.lat, lng:u.lng, id:u.mobile }))),
    bucketDistinctByState(newEarnerMobiles.map(m=>({ lat: userByMobile[m] && userByMobile[m].lat, lng: userByMobile[m] && userByMobile[m].lng, id: m })))
  ]);

  const trend = bucketize(history.filter(r=>r.amount > 0).map(r=>({ date: new Date(r.created_at), value: 1 })), from, to);
  return {
    values: { totalEarningUsers: earners.length, highestEarningUsers: highestEarners.length, newEarningUsers: newEarnerMobiles.length },
    stateBreakdown: { totalEarningUsers: totalStates, highestEarningUsers: highestStates, newEarningUsers: newStates },
    trend, trendLabel: "Earning activity", trendColor: "#2e7d32"
  };
}

async function loadCompanyMetrics(from, to){
  // Same target-location caveat as loadVendorMetrics: this is revenue
  // by where each campaign is aimed, not by any company address.
  const { data, error } = await supabaseClient.from('campaigns').select('budget, status, created_at, lat, lng');
  if(error){ console.error('loadCompanyMetrics error:', error); return null; }
  const rows = data || [];
  const sum = (list) => list.reduce((a,r)=>a + (r.budget || 0), 0);

  const activeRows = rows.filter(r=>r.status === 'Active');
  const newRows = rows.filter(r=>{
    const t = new Date(r.created_at).getTime();
    return (!from || t >= from.getTime()) && t <= to.getTime();
  });

  const [totalStates, activeStates, newStates] = await Promise.all([
    bucketSumByState(rows.map(r=>({ lat:r.lat, lng:r.lng, value:r.budget||0 }))),
    bucketSumByState(activeRows.map(r=>({ lat:r.lat, lng:r.lng, value:r.budget||0 }))),
    bucketSumByState(newRows.map(r=>({ lat:r.lat, lng:r.lng, value:r.budget||0 })))
  ]);

  const trend = bucketize(rows.map(r=>({ date: new Date(r.created_at), value: r.budget || 0 })), from, to);
  return {
    values: { totalCompanyRevenue: sum(rows), activeCompanyRevenue: sum(activeRows), newCompanyRevenue: sum(newRows) },
    stateBreakdown: { totalCompanyRevenue: totalStates, activeCompanyRevenue: activeStates, newCompanyRevenue: newStates },
    trend, trendLabel: "Revenue", trendColor: "#e65100"
  };
}

const LOADERS = { vendor: loadVendorMetrics, user: loadUserMetrics, company: loadCompanyMetrics };

async function refresh(period){
  currentPeriod = period;
  const { from, to } = periodRange(period, dateFromInput.value, dateToInput.value);

  const result = await (LOADERS[type] || LOADERS.vendor)(from, to);
  if(!result){
    boxGrid.innerHTML = '<div class="data-box">Couldn\'t load live data — please try again.</div>';
    return;
  }
  lastResult = result;

  cfg.boxes.forEach(b=>{
    renderStateList(document.getElementById(`box-${b.key}`), b.title, result.values[b.key] || 0, result.stateBreakdown[b.key] || {}, !!b.isCurrency, (state)=>stateLink(b, state));
  });
  renderTrendChart("trendChart", result.trend, result.trendLabel, result.trendColor);
}

function stateLink(box, state){
  const back = encodeURIComponent(location.pathname + location.search);
  return `state_detail.html?type=${encodeURIComponent(type)}&metric=${encodeURIComponent(box.key)}&metricTitle=${encodeURIComponent(box.title)}&state=${encodeURIComponent(state)}&back=${back}`;
}

document.getElementById("pageNote").textContent = type === "user"
  ? "Pan-India figures below, from live data. State is the user's own detected location. Tap any state to see its district-wise breakdown."
  : "Pan-India figures below, from live data. State is where each campaign is targeted, not a vendor/company address — neither is stored anywhere. Tap any state to see its district-wise breakdown.";

initPeriodSelector(periodRow, refresh, dateRangeRow);
refresh(currentPeriod);
dateFromInput.onchange = ()=> { if(currentPeriod === "Date Range") refresh(currentPeriod); };
dateToInput.onchange = ()=> { if(currentPeriod === "Date Range") refresh(currentPeriod); };

document.getElementById("downloadBtn").onclick = ()=>{
  if(!lastResult) return;
  const headers = ["Metric", "State", "Value"];
  let rows = [];
  cfg.boxes.forEach(b=>{
    rows.push([b.title, "ALL INDIA", lastResult.values[b.key] || 0]);
    Object.entries(lastResult.stateBreakdown[b.key] || {})
      .sort((a,b)=>b[1]-a[1])
      .forEach(([state, val]) => rows.push([b.title, state, val]));
  });
  downloadCSV(type + "_" + currentPeriod.replace(/\s+/g,"_") + "_report.csv", headers, rows);
};
</script>
</body>
</html>
