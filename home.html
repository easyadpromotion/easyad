    <!-- ✅ Your actual API key with all required libraries.
         This key is ONLY used to render the little map inside the "view on map"

    <script>
        var mapsReady = false;
        var mapsFailed = false;
        function initMap() { mapsReady = true; }
        // Fires if Google blocks this key for this domain (referrer restriction,
        // API not enabled, billing not set up, etc.) — without this, a blocked
        // key fails completely silently and the map modal hangs forever.
        window.gm_authFailure = function () {
            mapsFailed = true;
            console.error("❌ gm_authFailure: Google Maps blocked this request for this domain/key. " +
                "Check the key's HTTP referrer restrictions and that Maps JavaScript API is enabled.");
        };

<script>
    // ══════════════════════════════════════════════════════════════
    // ── CLOUD USER SYNC ──────────────────────────────────────────
    // Wallet balance + which ads have been claimed now live in Supabase
    // ("users" + "user_ad_history" tables), keyed by mobile number — NOT
    // just this browser's localStorage. This is what makes the balance
    // and "already viewed" state consistent across devices for the same
    // account. localStorage is still written as an instant-paint cache
    // so the UI isn't blank while the network call is in flight, but
    // Supabase is the source of truth and this sync runs on every load.
    // ══════════════════════════════════════════════════════════════
    async function syncUserFromCloud(mobile) {
        const { data: userRow, error: userErr } = await supabaseClient
            .from('users')
            .select('*')
            .eq('mobile', mobile)
            .maybeSingle();
        if (userErr) { console.error('syncUserFromCloud user error:', userErr); return null; }

        const { data: historyRows, error: histErr } = await supabaseClient
            .from('user_ad_history')
            .select('*')
            .eq('user_mobile', mobile)
            .order('created_at', { ascending: false });
        if (histErr) { console.error('syncUserFromCloud history error:', histErr); }

        const adHistory = (historyRows || []).map(function (r) {
            return { id: r.campaign_id, name: r.ad_name, type: r.ad_type, amount: r.amount, date: new Date(r.created_at).toLocaleDateString(), time: new Date(r.created_at).toLocaleTimeString() };
        });
        const viewedAds = (historyRows || []).map(function (r) { return r.campaign_id; });

        var local = JSON.parse(localStorage.getItem("userProfile_" + mobile)) || {};

        // ── One-time migration of pre-Supabase local claims ──────────
        // Ads claimed before this account had a cloud history record only
        // exist in this browser's localStorage — the cloud has no idea
        // they happened, so they'd wrongly reappear as claimable. Push just
        // the CLAIM RECORD (amount 0, not a wallet credit — we can't safely
        // tell whether the current cloud balance already reflects these
        // old local earnings, so we never auto-credit them) so they're
        // correctly hidden everywhere from now on. Self-limiting: once an
        // id is migrated it shows up in the cloud next time and is skipped.
        var localAdHistory = local.adHistory || [];
        var cloudIdSet = {};
        viewedAds.forEach(function (id) { cloudIdSet[id] = true; });
        var toMigrate = localAdHistory.filter(function (tx) { return tx.id && !cloudIdSet[tx.id]; });
        if (toMigrate.length) {
            try {
                var migrateRows = toMigrate.map(function (tx) {
                    return { user_mobile: mobile, campaign_id: tx.id, ad_name: tx.name || null, ad_type: tx.type || null, amount: 0 };
                });
                await supabaseClient.from('user_ad_history').insert(migrateRows);
                toMigrate.forEach(function (tx) {
                    adHistory.unshift({ id: tx.id, name: tx.name, type: tx.type, amount: 0, date: tx.date, time: tx.time });
                    viewedAds.push(tx.id);
                });
            } catch (e) { console.error('local history migration error (non-blocking):', e); }
        }

        var merged = Object.assign({}, local, {
            wallet: userRow ? (userRow.wallet || 0) : (local.wallet || 0),
            city: (userRow && userRow.city) || local.city,
            lat: (userRow && userRow.lat != null) ? userRow.lat : local.lat,
            lng: (userRow && userRow.lng != null) ? userRow.lng : local.lng,
            name: (userRow && (userRow.first_name || userRow.last_name)) ? [userRow.first_name, userRow.last_name].filter(Boolean).join(" ") : local.name,
            // These only populate for accounts that completed the FULL current
            // registration flow — pre-existing accounts (created before that
            // flow wrote to Supabase, or via the bare mobile+city row from
            // ensure_user_exists) will have these as null/undefined here even
            // though they're "logged in" — that's the real, current state of
            // the row, not a bug. See the profile-completion nudge below.
            dob: (userRow && userRow.dob) || local.dob,
            gender: (userRow && userRow.gender) || local.gender,
            profession: (userRow && userRow.profession) || local.profession,
            specificRole: (userRow && userRow.specific_role) || local.specificRole,
            adHistory: adHistory,
            viewedAds: viewedAds
        });
        localStorage.setItem("userProfile_" + mobile, JSON.stringify(merged));
        return merged;
    }

    // ── State ──────────────────────────────────────────────────
    var userLat = null, userLng = null;
    var mapInstance = null, markerInstance = null;
    // mapsReady / mapsFailed / initMap / gm_authFailure are defined in the
    // <head> script now — city detection below no longer depends on them.
    var activeMobile = null, userProfile = null;

    // ── Page Load ──────────────────────────────────────────────
    async function loadHome() {
        activeMobile = localStorage.getItem("activeUser");
        if (!activeMobile) { window.location.href = "user_login.html"; return; }

        userProfile = JSON.parse(localStorage.getItem("userProfile_" + activeMobile)) || { wallet: 0, viewedAds: [] };

        // Paint instantly from whatever's cached locally...
        document.getElementById("dispBal").innerText = "₹ " + parseFloat(userProfile.wallet || 0).toFixed(2);
        if (userProfile.city) setCity(userProfile.city);

        // ...then reconcile against the cloud, which is authoritative.
        var cloud = await syncUserFromCloud(activeMobile);
        if (cloud) {
            userProfile = cloud;
            document.getElementById("dispBal").innerText = "₹ " + parseFloat(userProfile.wallet || 0).toFixed(2);
            if (userProfile.city) setCity(userProfile.city);
            loadTasks(); // re-render now that viewedAds reflects the cloud
        }
        updateProfileNudge();

        // Start GPS
        startLocationDetect();

        // Keep location current without any action from the user — re-checks
        // every few minutes in the background (see LOC_REFRESH_MS below).
        setInterval(silentLocationRefresh, LOC_REFRESH_MS);

        // Notifications badge (from the shared notification store)
        updateNotifBadge();
        checkForNewAds();

        // Tasks (first paint from local cache; re-rendered above once cloud sync lands)
        loadTasks();
    }

    // ── Profile-completion nudge ──────────────────────────────
    // A profile counts as "incomplete" if it's missing ANY of the fields
    // registration.html's later steps collect — DOB, Gender, Profession,
    // or Specific Role. Links into registration.html?mobile=X&complete=1,
    // which skips straight past the name steps for an already-known account.
    function updateProfileNudge() {
        var incomplete = !userProfile.dob || !userProfile.gender || !userProfile.profession || !userProfile.specificRole;
        var el = document.getElementById("profileNudge");
        el.classList.toggle("show", incomplete);
        if (incomplete) {
            el.href = "registration.html?mobile=" + encodeURIComponent(activeMobile) + "&complete=1";
        }
    }

    // ── Location Detection ─────────────────────────────────────
    // maximumAge: 0 forces a genuinely fresh GPS/network fix every time —
    // without it, the browser is free to hand back an old cached position
    // (potentially from a previous location entirely), which is the most
    // likely reason a stale city could show up here.
    var LOC_REFRESH_MS = 3 * 60 * 1000; // background re-check every 3 minutes
    var GEO_OPTS = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

    function startLocationDetect() {
        if (!navigator.geolocation) {
            setCity(userProfile.city || "India");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(pos) {
                userLat = pos.coords.latitude;
                userLng  = pos.coords.longitude;
                // Resolve the city name straight away — this does NOT wait on
                // or depend on the Google Maps SDK, so it still works even if
                // that script is blocked, slow, or misconfigured for this domain.
                reverseGeocodeAndSetCity(userLat, userLng);
            },
            function(err) {
                console.warn("GPS error:", err.message);
                setCity(userProfile.city || "India");
            },
            GEO_OPTS
        );
    }

    // Same GPS re-check as startLocationDetect(), but silent — doesn't reset
    // the display to the pulsing "Locating…" state, so it doesn't flicker
    // every few minutes while the person is just browsing. Only updates the
    // label if a fresh fix actually succeeds.
    function silentLocationRefresh() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                reverseGeocodeAndSetCity(userLat, userLng);
            },
            function(err) { console.warn("Background GPS refresh failed:", err.message); },
            GEO_OPTS
        );
    }

    // Manual refresh — tapping the 📍 icon on the location card. Shows the
    // pulsing "Locating…" state immediately so it's clear something's happening.
    function refreshLocation() {
        document.getElementById("dispCity").innerHTML = '<span class="locating-dot"></span> Locating…';
        startLocationDetect();
    }

    // ── Reverse Geocode via OpenStreetMap Nominatim ─────────────
    // Free, no API key, no SDK dependency — this is what actually determines
    // the city name shown in the header. The Google Maps SDK (if it loads) is
    // used only for the little visual map inside the "view on map" modal.
    // zoom=16 + neighbourhood-first ordering gives a finer-grained, more
    // accurate label than a broad ward/suburb name.
    function reverseGeocodeAndSetCity(lat, lng) {
        var city = userProfile.city || "India";
        var fullAddr = city;

        fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lng + "&zoom=16&addressdetails=1", {
            headers: { "Accept": "application/json" }
        })
        .then(function(res){ return res.json(); })
        .then(function(data){
            var addr = data.address || {};
            city = addr.neighbourhood || addr.suburb || addr.city_district || addr.city || addr.town || addr.state_district || addr.county || addr.state || city;
            fullAddr = data.display_name || city;
            finishLocationUpdate(city, fullAddr, lat, lng);
        })
        .catch(function(e){
            console.warn("Reverse geocode failed, falling back:", e.message);
            finishLocationUpdate(city, fullAddr, lat, lng);
        });
    }

    async function finishLocationUpdate(city, fullAddr, lat, lng) {
        setCity(city);
        document.getElementById("mapCity").innerText    = city;
        document.getElementById("mapAddress").innerText = fullAddr;

        // Persist to this user's local cache
        userProfile.city = city;
        userProfile.lat  = lat;
        userProfile.lng  = lng;
        localStorage.setItem("userProfile_" + activeMobile, JSON.stringify(userProfile));

        // ...and to the cloud, so the city/location is also consistent
        // across devices (not just this browser). Best-effort — a failed
        // write here shouldn't block anything else on the page.
        try {
            await supabaseClient.rpc('ensure_user_exists', { p_mobile: activeMobile, p_city: city });
            await supabaseClient.from('users').update({ lat: lat, lng: lng, city: city }).eq('mobile', activeMobile);
        } catch (e) { console.error('Cloud location sync failed (non-blocking):', e); }

        // Also share it with the app-wide location cache that notifications.html
        // reads, so "new ad nearby" distance-matching stays in sync everywhere.
        localStorage.setItem("eap_user_location", JSON.stringify({ lat: lat, lng: lng, label: city }));

        // A fresh location is exactly when a previously-out-of-range ad might now
        // be in range, so re-check for nearby ads immediately.
        checkForNewAds();
    }

    function getComp(comps, type) {
        var found = comps.find(function(c){ return c.types.indexOf(type) !== -1; });
        return found ? found.long_name : null;
    }

    function setCity(name) {
        document.getElementById("dispCity").innerHTML = name; // removes pulsing dot
    }

    // ── Map Modal ──────────────────────────────────────────────
    function openMap() {
        document.getElementById("mapOverlay").classList.add("open");
        if (userLat && userLng && mapsReady) {
            renderMap();
        } else if (mapsFailed) {
            document.getElementById("googleMap").innerHTML =
                '<div style="display:flex;align-items:center;justify-content:center;height:250px;color:#aaa;font-size:12px;text-align:center;padding:0 20px;">Map preview is unavailable right now.<br>Your city is still detected correctly above.</div>';
        } else if (userLat && userLng) {
            // Got GPS coords but the Maps SDK hasn't finished loading yet — poll briefly.
            setTimeout(function(){ if (document.getElementById("mapOverlay").classList.contains("open")) openMap(); }, 400);
        }
    }

    function closeMap() {
        document.getElementById("mapOverlay").classList.remove("open");
    }

    function handleOverlayClick(e) {
        if (e.target === document.getElementById("mapOverlay")) closeMap();
    }

    function renderMap() {
        var pos = { lat: userLat, lng: userLng };
        var mapDiv = document.getElementById("googleMap");

        if (!mapInstance) {
            mapInstance = new google.maps.Map(mapDiv, {
                center: pos,
                zoom: 15,
                disableDefaultUI: true,
                zoomControl: true,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#f5f5f5" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#c9d9e8" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#ffffff" }] },
                    { featureType: "poi", stylers: [{ visibility: "off" }] }
                ]
            });

            // Orange pin
            new google.maps.Marker({
                position: pos,
                map: mapInstance,
                title: "You are here",
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 11,
                    fillColor: "#ff9800",
                    fillOpacity: 1,
                    strokeColor: "#ffffff",
                    strokeWeight: 3
                }
            });
        } else {
            mapInstance.setCenter(pos);
        }
    }

    // ── Supabase-backed getActiveAds() — shared by loadTasks() and
    // checkForNewAds() below. Replaces localStorage("vendorCampaigns").
    async function getActiveAds() {
        const { data, error } = await supabaseClient
            .from('campaigns')
            .select('*')
            .order('created_at', { ascending: false });
        if (error) { console.error('Supabase getActiveAds error:', error); return []; }
        return (data || []).map(function (row) {
            return {
                id: row.id,
                type: row.type,
                status: row.status,
                title: row.title,
                name: row.title,
                category: row.category,
                location: row.location,
                lat: row.lat,
                lng: row.lng,
                video_url: row.video_url,
                image_url: row.image_url
            };
        });
    }

    // An ad is only "ready" to show as a startable task if it actually has
    // the content its type needs — otherwise Start leads straight to a
    // "Video Not Ready" / "No video uploaded" dead end, like Coffee and
    // Mehendi design did before this fix. Surveys don't need video/image,
    // so they're always considered ready here (their own page separately
    // disables Start if a survey genuinely has zero questions).
    function hasReadyContent(ad) {
        if (ad.type === "Video") return !!(ad.video_url && String(ad.video_url).trim());
        if (ad.type === "Frame") return !!(ad.image_url && String(ad.image_url).trim());
        return true;
    }

    // ── Tasks ──────────────────────────────────────────────────
    async function loadTasks() {
        var allAds   = await getActiveAds();
        var viewed   = userProfile.viewedAds || [];
        // NOTE: was checking ad.status === "Active" — tightened to match
        // whatever admin_approve_ads.html actually sets (see isLiveStatus()
        // below). If your approval page uses a specific status string like
        // "Approved" or "Live", both this and the notification matcher will
        // pick it up automatically as long as it isn't "Pending"/"Rejected".
        var active   = allAds.filter(function(ad){ return isLiveStatus(ad.status) && viewed.indexOf(ad.id) === -1 && hasReadyContent(ad); });
        var container = document.getElementById("taskContainer");

        container.innerHTML = "";

        if (active.length === 0) {
            container.innerHTML = '<div class="empty-state">' + t('noTasksLine1') + '<br>' + t('noTasksLine2') + '</div>';
            if (allAds.length === 0) {
                container.innerHTML += '<div class="task-card"><div class="t-left"><div class="t-icon">🏦</div><div class="t-info"><div class="t-name">Business Loans</div><div class="t-sub">Finance • High Reward</div></div></div><a href="frame-ads.html" class="start-btn">' + t('startBtn') + '</a></div>';
            }
            return;
        }

        // Each task's name/category is real vendor-typed text — not something
        // that can live in a fixed dictionary — so it's translated live via
        // translateDynamic() (cached, falls back to English on any failure)
        // whenever the current language isn't English.
        var startLabel = t('startBtn');
        for (var ti = 0; ti < active.length; ti++) {
            var ad = active[ti];
            var link = "frame-ads.html", icon = "🖼️";
             if (ad.type === "Video")  { link = "video-ads.html"; icon = "▶️"; }
            if (ad.type === "Survey") { link = "surveys.html";   icon = "📝"; }
            // Deep-link straight to this specific ad instead of the generic
            // list — video-ads.html / surveys.html read this "open" param
            // and auto-open that exact ad's viewing overlay on load.
            link += "?open=" + encodeURIComponent(ad.id);
            // Fix: use ad.name, ad.title, or ad.adName with fallback
            var name = ad.name || ad.title || ad.adName || "Sponsored Ad";
            var cat  = ad.category || ad.type || "Task";

            if (currentLang !== "en") {
                name = await translateDynamic(name, currentLang);
                cat = await translateDynamic(cat, currentLang);
            }

            container.innerHTML += '<div class="task-card"><div class="t-left"><div class="t-icon">' + icon + '</div><div class="t-info"><div class="t-name">' + name + '</div><div class="t-sub">' + cat + '</div></div></div><a href="' + link + '" class="start-btn">' + startLabel + '</a></div>';
        }
    }


    // ═══════════════════════════════════════════════════════════
    // NOTIFICATION ENGINE — shares localStorage keys with
    // notifications.html so both pages agree on what's been seen,
    // what's unread, and what counts as "nearby". Having this here
    // (not just on notifications.html) is what makes a new ad pop
    // up immediately while the user is sitting on the home screen,
    // which is where they'll actually see it most of the time.
    // ═══════════════════════════════════════════════════════════
    var SEEN_KEY = "eap_seen_ad_ids";
    var NOTIF_KEY = "eap_user_notifications";
    var LOC_KEY = "eap_user_location";
    var NEARBY_RADIUS_KM = 25;
    var POLL_MS = 4000;

    function loadJSON(key, fallback) {
        try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
        catch (e) { return fallback; }
    }
    function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
    function adTitle(ad) { return ad.title || ad.name || ad.adName || "New Ad"; }
    function isLiveStatus(status) {
        var s = (status || "").toLowerCase();
        return s !== "" && s !== "pending" && s.indexOf("reject") === -1 && s.indexOf("declin") === -1;
    }
    function haversineKm(lat1, lon1, lat2, lon2) {
        var R = 6371;
        var dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
        var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateNotifBadge() {
        var notifs = loadJSON(NOTIF_KEY, []);
        var unread = notifs.filter(function(n){ return n.unread; }).length;
        var badge = document.getElementById("notifBadge");
        if (unread > 0) { badge.textContent = unread > 9 ? "9+" : unread; badge.classList.add("show"); }
        else { badge.classList.remove("show"); }
    }

    function showHomeToast(title, msg) {
        document.getElementById("homeToastTitle").textContent = title;
        document.getElementById("homeToastMsg").textContent = msg;
        var toast = document.getElementById("homeToast");
        toast.classList.add("show");
        clearTimeout(showHomeToast._t);
        showHomeToast._t = setTimeout(function(){ toast.classList.remove("show"); }, 5000);
    }

    async function checkForNewAds() {
        var ads = await getActiveAds();
        if (!ads.length) return;
        var userLoc = loadJSON(LOC_KEY, null);
        var seen = loadJSON(SEEN_KEY, []);
        var seenSet = {};
        seen.forEach(function(id){ seenSet[id] = true; });
        var notifs = loadJSON(NOTIF_KEY, []);
        var addedAny = false;

        for (var ai = 0; ai < ads.length; ai++) {
            var ad = ads[ai];
            if (!ad || !ad.id || seenSet[ad.id]) continue;
            if (!isLiveStatus(ad.status)) continue;
            if (!hasReadyContent(ad)) continue; // no video/image yet — don't notify or mark seen; check again next poll

            var matchesLocation = true, distLabel = ad.location || "you";
            if (userLoc && userLoc.lat != null && ad.lat != null && ad.lng != null) {
                var dist = haversineKm(userLoc.lat, userLoc.lng, ad.lat, ad.lng);
                matchesLocation = dist <= NEARBY_RADIUS_KM;
                distLabel = dist.toFixed(1) + "km away";
            }

            seenSet[ad.id] = true; // processed either way
            if (!matchesLocation) continue;

            // The ad's real name is vendor-typed text, not something a fixed
            // dictionary can cover — translated live (cached, falls back to
            // English on failure) same as the Sponsored Tasks list above.
            var displayAdTitle = adTitle(ad);
            if (currentLang !== "en") displayAdTitle = await translateDynamic(displayAdTitle, currentLang);

            var title = "📢 New " + (ad.type || "Ad") + " from a vendor!";
            var msg = displayAdTitle + " is live — " + distLabel + ". Tap to check it out.";
            notifs.unshift({ id: "ad_" + ad.id, title: title, msg: msg, time: Date.now(), unread: true });
            addedAny = true;
            showHomeToast(title, msg);
        }

        var newSeen = [];
        for (var k in seenSet) newSeen.push(k);
        saveJSON(SEEN_KEY, newSeen);

        if (addedAny) {
            saveJSON(NOTIF_KEY, notifs);
            updateNotifBadge();
        }
    }

    setInterval(checkForNewAds, POLL_MS);
    // Re-render Sponsored Tasks in the newly-selected language — called by
    // i18n.js's applyLang() whenever the person picks a different language.
    window.onLangChanged = function () { loadTasks(); };
    // ⚠️ The old cross-tab "storage" event listener for vendorCampaigns is
    // removed — that only ever fired when localStorage changed on this
    // same origin/browser, which doesn't apply now that ads live in
    // Supabase. The setInterval poll above is now the only mechanism that
    // catches new/approved ads, including ones posted from other devices.
    window.addEventListener("storage", function(e){
        if (e.key === NOTIF_KEY) updateNotifBadge();
    });
</script>
