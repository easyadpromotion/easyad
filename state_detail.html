<div class="mobile-screen">

        <div class="section-title" style="margin:18px 0 4px;">Filter Period</div>

        <div class="date-range-row" id="dateRangeRow">
            <input type="date" id="dateFrom">
            <input type="date" id="dateTo">
        </div>

        <div class="data-box" id="geoTreeCard">
            <div class="metric-head"><h5>District &amp; Urban/Rural Breakdown</h5><span class="metric-total" id="geoTreeTotal">0</span></div>
            <div id="geoTree"></div>
            <button class="btn-primary btn-secondary" id="downloadGeoBtn" style="margin-top:10px;">Download District Breakdown</button>
        </div>

        <div class="data-box">
            <div class="metric-head"><h5 id="stateLabel">District-wise breakdown</h5><span class="metric-total" id="stateTotal">0</span></div>

</div>

<script>
/* ============================================================
   SHARED HELPERS — used by every page in the admin dashboard app
   ============================================================ */

const PERIODS = ["Day", "Week", "Month", "Half Yearly", "Yearly", "Date Range"];

function periodRangeForState(period){
  const to = new Date();
  if(period === "Date Range"){
    const df = document.getElementById("dateFrom").value;
    const dt = document.getElementById("dateTo").value;
    return { from: df ? new Date(df + "T00:00:00") : null, to: dt ? new Date(dt + "T23:59:59") : to };
  }
  const days = { "Day":1, "Week":7, "Month":30, "Half Yearly":182, "Yearly":365 }[period];
  return { from: days ? new Date(to.getTime() - days*24*60*60*1000) : null, to };
}

/* ============================================================
   REAL DISTRICT / URBAN-RURAL RESOLUTION — INDIA_GEO below is only
   used by the pre-existing matchesState() heuristic in the vendor/
   company/user sections further down. The tree in THIS section
   instead reverse-geocodes each row's real lat/lng via OpenStreetMap
   Nominatim (same free API home.html already uses for city detection)
   to get an actual state + district + urban/rural classification —
   the same method the Pan-India list pages (user_dashboard.html,
   detail.html) use, so a state's tree total here genuinely matches
   the number you clicked through on. Urban/rural is a heuristic:
   Nominatim address has city/town/suburb → Urban, village/hamlet →
   Rural, otherwise defaults to Urban.
   ============================================================ */
const geoCache = new Map();
let lastGeocodeAt = 0;
async function resolveGeo(lat, lng){
  if(lat == null || lng == null) return { state:"Unspecified", district:"Unspecified", isUrban:true, place:"Unspecified" };
  const key = lat.toFixed(3) + "," + lng.toFixed(3);
  if(geoCache.has(key)) return geoCache.get(key);
  const wait = Math.max(0, 1100 - (Date.now() - lastGeocodeAt));
  if(wait) await new Promise(r => setTimeout(r, wait));
  lastGeocodeAt = Date.now();
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=14&addressdetails=1`);
    const data = await res.json();
    const addr = data.address || {};
    const geo = {
      state: addr.state || "Unspecified",
      district: addr.state_district || addr.county || ((addr.state || "Unspecified") + " District"),
      isUrban: !!(addr.city || addr.town || addr.suburb || addr.city_district),
      place: addr.neighbourhood || addr.suburb || addr.village || addr.city_district || addr.city || addr.town || "Unspecified"
    };
    geoCache.set(key, geo);
    return geo;
  }catch(e){
    console.error('resolveGeo error:', e);
    const geo = { state:"Unspecified", district:"Unspecified", isUrban:true, place:"Unspecified" };
    geoCache.set(key, geo);
    return geo;
  }
}

/* ---- groups already-resolved {id or value, geo} items into a real
   district > urban/rural tree, sorted by district total descending.
   isSum=false counts distinct ids (e.g. distinct vendors/users);
   isSum=true sums a numeric value (e.g. revenue). ---- */
function bucketDistrictFromResolved(items, isSum){
  const tree = {};
  items.forEach(it=>{
    const d = it.geo.district;
    if(!tree[d]) tree[d] = { urbanSet:new Set(), ruralSet:new Set(), urbanSum:0, ruralSum:0, urbanPlace:it.geo.place, ruralPlace:it.geo.place };
    if(it.geo.isUrban){
      if(isSum) tree[d].urbanSum += it.value; else tree[d].urbanSet.add(it.id);
      tree[d].urbanPlace = it.geo.place;
    } else {
      if(isSum) tree[d].ruralSum += it.value; else tree[d].ruralSet.add(it.id);
      tree[d].ruralPlace = it.geo.place;
    }
  });
  return Object.entries(tree).map(([district, v])=>{
    const urbanVal = isSum ? v.urbanSum : v.urbanSet.size;
    const ruralVal = isSum ? v.ruralSum : v.ruralSet.size;
    return { district, total: urbanVal + ruralVal, urban:{ value: urbanVal, place: v.urbanPlace }, rural:{ value: ruralVal, place: v.ruralPlace } };
  }).sort((a,b)=> b.total - a.total);
}

function renderRealDistrictTree(container, districts, isCurrency){
  const fmt = v => isCurrency ? "₹" + v.toLocaleString(undefined, {maximumFractionDigits:2}) : v.toLocaleString();
  if(!districts.length){
    container.innerHTML = '<div style="text-align:center;color:#aaa;padding:16px;font-size:12px;">No data for this state in this period.</div>';
    return;
  }
  container.innerHTML = districts.map(d => `
    <div class="district-block">
      <div class="geo-row lvl-district"><span class="geo-name">${d.district}</span><span class="geo-val">${fmt(d.total)}</span></div>
      <div class="geo-row lvl-place"><span class="geo-tag">Urban</span><span class="geo-name">${d.urban.place}</span><span class="geo-val">${fmt(d.urban.value)}</span></div>
      <div class="geo-row lvl-place"><span class="geo-tag">Rural</span><span class="geo-name">${d.rural.place}</span><span class="geo-val">${fmt(d.rural.value)}</span></div>
    </div>
  `).join("");
}

/* ============================================================
   PAN-INDIA STATE/DISTRICT NAME LIST — used only by matchesState()
   below, a text-matching heuristic for the vendor/company/user
   sections further down (pre-existing, real, spreadsheet-verified
   logic — left as-is). The district/urban-rural TREE above this
   uses real reverse-geocoded coordinates instead, not this list.
   ============================================================ */
const INDIA_GEO = {
  "Andhra Pradesh": ["Visakhapatnam","Vijayawada (NTR)","Guntur"],
  "Arunachal Pradesh": ["Papum Pare","East Siang","West Kameng"],
  "Assam": ["Kamrup Metropolitan","Dibrugarh","Cachar"],
  "Bihar": ["Patna","Gaya","Muzaffarpur"],
  "Chhattisgarh": ["Raipur","Bilaspur","Durg"],
  "Goa": ["North Goa","South Goa"],
  "Gujarat": ["Ahmedabad","Surat","Vadodara"],
  "Haryana": ["Gurugram","Faridabad","Panipat"],
  "Himachal Pradesh": ["Shimla","Kangra","Mandi"],
  "Jharkhand": ["Ranchi","East Singhbhum","Dhanbad"],
  "Karnataka": ["Bengaluru Urban","Mysuru","Dakshina Kannada"],
  "Kerala": ["Thiruvananthapuram","Ernakulam","Kozhikode"],
  "Madhya Pradesh": ["Bhopal","Indore","Jabalpur"],
  "Maharashtra": ["Mumbai Suburban","Pune","Nagpur"],
  "Manipur": ["Imphal West","Imphal East"],
  "Meghalaya": ["East Khasi Hills","West Garo Hills"],
  "Mizoram": ["Aizawl","Lunglei"],
  "Nagaland": ["Kohima","Dimapur"],
  "Odisha": ["Khordha","Cuttack","Puri"],
  "Punjab": ["Ludhiana","Amritsar","Jalandhar"],
  "Rajasthan": ["Jaipur","Jodhpur","Udaipur"],
  "Sikkim": ["East Sikkim","West Sikkim"],
  "Tamil Nadu": ["Chennai","Coimbatore","Madurai"],
  "Telangana": ["Hyderabad","Rangareddy","Warangal"],
  "Tripura": ["West Tripura","Gomati"],
  "Uttar Pradesh": ["Lucknow","Kanpur Nagar","Varanasi"],
  "Uttarakhand": ["Dehradun","Haridwar","Nainital"],
  "West Bengal": ["Kolkata","Howrah","Darjeeling"],
  "Andaman and Nicobar Islands": ["South Andaman"],
  "Chandigarh": ["Chandigarh"],
  "Dadra and Nagar Haveli and Daman and Diu": ["Dadra and Nagar Haveli","Daman"],
  "Delhi": ["New Delhi","South Delhi","North Delhi"],
  "Jammu and Kashmir": ["Srinagar","Jammu"],
  "Ladakh": ["Leh","Kargil"],
  "Lakshadweep": ["Lakshadweep"],
  "Puducherry": ["Puducherry","Karaikal"]
};
const INDIA_STATE_NAMES = Object.keys(INDIA_GEO);

/* ---- period selector chips + date range inputs ----
   container: element to render chips into
   onChange(period): callback fired with the chosen period label */
function initPeriodSelector(container, onChange, dateRangeContainer){
  container.innerHTML = "";
  PERIODS.forEach((p, i)=>{
    const chip = document.createElement("button");
    chip.className = "period-chip" + (i===2 ? " active" : "");
    chip.textContent = p;
    chip.onclick = ()=>{
      [...container.children].forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      if(dateRangeContainer){
        dateRangeContainer.classList.toggle("show", p === "Date Range");
      }
      onChange(p);
    };
    container.appendChild(chip);
  });
  return "Month"; // default selected period
}

/* ---- CSV export ---- */
function downloadCSV(filename, headers, rows){
  let csv = headers.join(",") + "\n";
  rows.forEach(r=>{ csv += r.map(v => typeof v === "string" && v.includes(",") ? `"${v}"` : v).join(",") + "\n"; });
  const blob = new Blob([csv], { type:"text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---- read a query-string param ---- */
function qParam(name, fallback){
  const v = new URLSearchParams(window.location.search).get(name);
  return v || fallback;
}

/* ============================================================
   REAL VENDOR / COMPANY REVENUE TABLES
   Replaces the mock district tree for type=vendor and type=company.
   Pricing formulas verified against your spreadsheet — every row of
   both sheets checks out exactly against these:
     Paid Amount      = targetUsers * 1.18   (18% GST)
     Utilized Amount  = viewers * 1.18
     Balance Amount   = Paid Amount - Utilized Amount
     User Profit      = viewers * 0.70
     Company Profit   = viewers * 0.30
     Govt Tax (GST)   = viewers * 0.18
   viewers = real count of rows in `ad_views` for that campaign.

   ── ASSUMPTIONS (confirm / correct these once real schema is known) ──
   1. Vendor name / contact: tries a few likely column names on the
      `campaigns` row (vendor_name/vendorName/owner_name/name, and
      vendor_contact/vendor_phone/contact_number/phone). Shows "—" if
      none of those columns exist yet.
   2. "Post of no of users" (the paid-for target): tries post_of_users /
      target_users / budget_users / target_views. Shows "—" if none
      exist — Paid Amount and Balance also show "—" in that case, since
      they depend on it (Utilized Amount, Viewers, Company Profit and
      Govt Tax still work regardless, since those only need `ad_views`).
   3. State matching: there is no dedicated `state` column anywhere in
      the app so far, so this matches the campaign's free-text `location`
      field against the state name and its known districts in INDIA_GEO.
      This is a heuristic and WILL miss campaigns whose location is a
      town/mandal not in that district list (e.g. "Jiyyammavalasa" won't
      match "Andhra Pradesh"). The real fix is adding a `state` field
      when a vendor posts an ad.
   ============================================================ */

function getVendorName(row){
  return row.vendor_name || row.vendorName || row.owner_name || row.name || null;
}
function getVendorContact(row){
  // vendor_contact/vendor_phone/contact_number/phone don't exist on any
  // campaigns row — but vendor_mobile does (it's how every campaign is
  // linked to its vendor), and IS the vendor's contact number.
  return row.vendor_contact || row.vendor_phone || row.contact_number || row.phone || row.vendor_mobile || null;
}
function getTargetUsers(row){
  const v = row.post_of_users ?? row.target_users ?? row.budget_users ?? row.target_views ?? null;
  return (v === null || v === undefined || v === "") ? null : Number(v);
}

function matchesState(locationText, stateName){
  if(!locationText) return false;
  const loc = String(locationText).toLowerCase();
  if(loc.indexOf(stateName.toLowerCase()) !== -1) return true;
  const districts = INDIA_GEO[stateName] || [];
  return districts.some(function(d){
    return loc.indexOf(d.toLowerCase().replace(/\s*\(.*?\)\s*/g, "")) !== -1;
  });
}

function periodToFromDate(period){
  const days = { "Day":1, "Week":7, "Month":30, "Half Yearly":182, "Yearly":365 }[period];
  if(!days) return null; // "Date Range" handled separately by the caller
  const d = new Date();
  d.setDate(d.getDate() - days);
  return d;
}

function fmtDateTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d)) return "—";
  const pad = n => String(n).padStart(2, "0");
  return pad(d.getDate()) + "-" + pad(d.getMonth()+1) + "-" + d.getFullYear() + " & " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function fmtAmt(v){
  return (v === null || v === undefined) ? "—" : "₹" + Number(v).toFixed(2);
}

/* ---- turns matched campaigns + their view counts into display rows ---- */
function buildRevenueRows(campaigns, viewCounts){
  return campaigns.map(function(c, idx){
    const viewers = viewCounts[c.id] || 0;
    const target = getTargetUsers(c);
    const paidAmount = target !== null ? +(target * 1.18).toFixed(2) : null;
    const utilizedAmount = +(viewers * 1.18).toFixed(2);
    const balance = paidAmount !== null ? +(paidAmount - utilizedAmount).toFixed(2) : null;
    return {
      sno: idx + 1,
      vendorName: getVendorName(c) || "—",
      vendorContact: getVendorContact(c) || "—",
      vendorLocation: c.location || "—",
      adType: c.type || "—",
      posted: fmtDateTime(c.created_at),
      target: target !== null ? target : "—",
      paidAmount: paidAmount,
      viewers: viewers,
      utilizedAmount: utilizedAmount,
      balance: balance,
      userProfit: +(viewers * 0.70).toFixed(2),
      companyProfit: +(viewers * 0.30).toFixed(2),
      govtTax: +(viewers * 0.18).toFixed(2)
    };
  });
}

/* ============================================================
   REAL DISTRICT / URBAN-RURAL TREE — one computeXDistrictTree per
   metric family, mirroring the exact Total/Active/New filters the
   Pan-India list pages use (user_dashboard.html, detail.html), so a
   state's tree total here always matches the number you clicked
   through on. metricKey tells us which of the three was clicked.
   ============================================================ */
const HIGH_EARNER_PERCENTILE = 0.8; // must match detail.html's definition exactly

async function computeUserDistrictTree(period, metricKey){
  const [usersRes, viewsRes] = await Promise.all([
    supabaseClient.from('users').select('mobile, lat, lng, registered_at'),
    supabaseClient.from('ad_views').select('viewer_mobile')
  ]);
  if(usersRes.error) throw usersRes.error;
  const users = usersRes.data || [];
  const activeMobiles = new Set((viewsRes.data || []).map(v=>v.viewer_mobile).filter(Boolean));
  const { from, to } = periodRangeForState(period);

  let subset = users;
  if(metricKey === "activeUsers") subset = users.filter(u=>activeMobiles.has(u.mobile));
  else if(metricKey === "newUsers") subset = users.filter(u=>{
    if(!u.registered_at) return false;
    const t = new Date(u.registered_at).getTime();
    return (!from || t >= from.getTime()) && t <= to.getTime();
  });

  const inState = [];
  for(const u of subset){
    const geo = await resolveGeo(u.lat, u.lng);
    if(geo.state === state) inState.push({ id: u.mobile, geo });
  }
  return { total: inState.length, districts: bucketDistrictFromResolved(inState, false), isCurrency: false };
}

async function computeEarningUserDistrictTree(period, metricKey){
  const [usersRes, historyRes] = await Promise.all([
    supabaseClient.from('users').select('mobile, wallet, lat, lng'),
    supabaseClient.from('user_ad_history').select('user_mobile, amount, created_at')
  ]);
  if(usersRes.error) throw usersRes.error;
  const users = usersRes.data || [];
  const history = historyRes.data || [];
  const userByMobile = {};
  users.forEach(u => userByMobile[u.mobile] = u);
  const { from, to } = periodRangeForState(period);

  const earners = users.filter(u => (u.wallet || 0) > 0);
  let subset = earners;

  if(metricKey === "highestEarningUsers"){
    const sortedWallets = earners.map(u=>u.wallet).sort((a,b)=>a-b);
    const cutoff = sortedWallets.length ? sortedWallets[Math.floor(sortedWallets.length * HIGH_EARNER_PERCENTILE)] : Infinity;
    subset = earners.filter(u => u.wallet >= cutoff);
  } else if(metricKey === "newEarningUsers"){
    const firstEarned = {};
    history.forEach(r=>{
      if(!(r.amount > 0)) return;
      const t = new Date(r.created_at).getTime();
      if(!(r.user_mobile in firstEarned) || t < firstEarned[r.user_mobile]) firstEarned[r.user_mobile] = t;
    });
    const newMobiles = Object.keys(firstEarned).filter(m => {
      const t = firstEarned[m];
      return (!from || t >= from.getTime()) && t <= to.getTime();
    });
    subset = newMobiles.map(m => userByMobile[m]).filter(Boolean);
  }

  const inState = [];
  for(const u of subset){
    const geo = await resolveGeo(u.lat, u.lng);
    if(geo.state === state) inState.push({ id: u.mobile, geo });
  }
  return { total: inState.length, districts: bucketDistrictFromResolved(inState, false), isCurrency: false };
}

async function computeVendorDistrictTree(period, metricKey){
  const { data, error } = await supabaseClient.from('campaigns').select('vendor_mobile, status, created_at, lat, lng');
  if(error) throw error;
  const rows = (data || []).filter(r => r.vendor_mobile);
  const { from, to } = periodRangeForState(period);

  let subsetRows = rows;
  if(metricKey === "activeVendors") subsetRows = rows.filter(r=>r.status === 'Active');
  else if(metricKey === "newVendors"){
    const firstRowByVendor = {};
    rows.forEach(r=>{
      const cur = firstRowByVendor[r.vendor_mobile];
      if(!cur || new Date(r.created_at) < new Date(cur.created_at)) firstRowByVendor[r.vendor_mobile] = r;
    });
    subsetRows = Object.values(firstRowByVendor).filter(r=>{
      const t = new Date(r.created_at).getTime();
      return (!from || t >= from.getTime()) && t <= to.getTime();
    });
  }

  const inState = [];
  for(const r of subsetRows){
    const geo = await resolveGeo(r.lat, r.lng);
    if(geo.state === state) inState.push({ id: r.vendor_mobile, geo });
  }
  const total = new Set(inState.map(x=>x.id)).size;
  return { total, districts: bucketDistrictFromResolved(inState, false), isCurrency: false };
}

async function computeCompanyDistrictTree(period, metricKey){
  const { data, error } = await supabaseClient.from('campaigns').select('budget, status, created_at, lat, lng');
  if(error) throw error;
  const rows = data || [];
  const { from, to } = periodRangeForState(period);

  let subsetRows = rows;
  if(metricKey === "activeCompanyRevenue") subsetRows = rows.filter(r=>r.status === 'Active');
  else if(metricKey === "newCompanyRevenue") subsetRows = rows.filter(r=>{
    const t = new Date(r.created_at).getTime();
    return (!from || t >= from.getTime()) && t <= to.getTime();
  });

  const inState = [];
  for(const r of subsetRows){
    const geo = await resolveGeo(r.lat, r.lng);
    if(geo.state === state) inState.push({ value: r.budget || 0, geo });
  }
  const total = inState.reduce((a,x)=>a+x.value, 0);
  return { total, districts: bucketDistrictFromResolved(inState, true), isCurrency: true };
}

async function computeAdCategoryDistrictTree(period, dbType){
  const { data, error } = await supabaseClient.from('campaigns').select('lat, lng').eq('type', dbType).eq('status', 'Active');
  if(error) throw error;
  const rows = data || [];

  const inState = [];
  for(let i = 0; i < rows.length; i++){
    const geo = await resolveGeo(rows[i].lat, rows[i].lng);
    if(geo.state === state) inState.push({ id: i, geo });
  }
  return { total: inState.length, districts: bucketDistrictFromResolved(inState, false), isCurrency: false };
}

const REVENUE_USER_KEYS = ["totalEarningUsers", "highestEarningUsers", "newEarningUsers"];

async function computeDistrictTree(period, metricKey){
  if(type === "vendor") return computeVendorDistrictTree(period, metricKey);
  if(type === "company") return computeCompanyDistrictTree(period, metricKey);
  if(type === "user") return REVENUE_USER_KEYS.includes(metricKey)
    ? computeEarningUserDistrictTree(period, metricKey)
    : computeUserDistrictTree(period, metricKey);
  if(AD_CATEGORY_TYPES[type]) return computeAdCategoryDistrictTree(period, AD_CATEGORY_TYPES[type]);
  return null;
}

let lastGeoTreeResult = null;

async function refreshGeoTree(period){
  const card = document.getElementById("geoTreeCard");
  if(!IS_REVENUE_TYPE && !IS_USER_TYPE && !IS_ADCAT_TYPE){ card.style.display = "none"; return; }
  card.style.display = "";
  document.getElementById("geoTree").innerHTML = '<div style="text-align:center;color:#aaa;padding:16px;font-size:12px;">Loading…</div>';
  try{
    const result = await computeDistrictTree(period, metricKey);
    lastGeoTreeResult = result;
    document.getElementById("geoTreeTotal").textContent = result.isCurrency

      : result.total.toLocaleString();
    renderRealDistrictTree(document.getElementById("geoTree"), result.districts, result.isCurrency);
  }catch(e){
    console.error('geo tree error:', e);
    lastGeoTreeResult = null;
    document.getElementById("geoTree").innerHTML = '<div style="text-align:center;color:#c62828;padding:16px;font-size:12px;">Couldn\'t load district data.</div>';

}

document.getElementById("downloadGeoBtn").onclick = ()=>{
  if(!lastGeoTreeResult) return;
  const headers = ["Metric", "State", "District", "Level", "Place", "Value"];
  const rows = [[metricTitle, state, "", "State Total", state, lastGeoTreeResult.total]];
  lastGeoTreeResult.districts.forEach(d=>{
    rows.push([metricTitle, state, d.district, "District Total", d.district, d.total]);
    rows.push([metricTitle, state, d.district, "Urban", d.urban.place, d.urban.value]);
    rows.push([metricTitle, state, d.district, "Rural", d.rural.place, d.rural.value]);
  });
  downloadCSV(type + "_" + state.replace(/\s+/g,"_") + "_" + currentPeriod.replace(/\s+/g,"_") + "_districts.csv", headers, rows);
};

/* ── Real "User" breakdown for one state ──────────────────────────────
   No mock numbers here: counts real rows in `ad_views` whose
   viewer_location matches this state (same heuristic as vendor/company —
   see matchesState() above), then derives distinct users, total views,
   and an estimated payout using the same ₹0.70/view rate verified
   against your spreadsheet. Replaces the old district/urban-rural mock
   tree, which had no real per-district user data to draw from. ── */
async function refreshUserTable(period){
  const treeEl = document.getElementById("districtTree");
  document.getElementById("stateLabel").textContent = "User Activity — " + state;
  treeEl.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;font-size:12px;">Loading…</div>';

  let fromDate = periodToFromDate(period);
  if(period === "Date Range"){
    const df = document.getElementById("dateFrom").value;
    fromDate = df ? new Date(df) : null;
  }

  try {
    const { data: views, error } = await supabaseClient
      .from('ad_views').select('viewer_mobile, viewer_location, created_at');
    if(error) throw error;

    const matched = (views || []).filter(function(v){
      if(!matchesState(v.viewer_location, state)) return false;
      if(fromDate && v.created_at && new Date(v.created_at) < fromDate) return false;
      return true;
    });

    currentUserViews = matched;
    const uniqueUsers = new Set(matched.map(function(v){ return v.viewer_mobile; }).filter(Boolean));
    const totalViews = matched.length;
    const estimatedEarnings = +(totalViews * 0.70).toFixed(2);

    document.getElementById("stateTotal").textContent = uniqueUsers.size.toLocaleString() + " users";
    treeEl.innerHTML =
      '<div class="geo-row lvl-district"><span class="geo-name">Active Users</span><span class="geo-val">' + uniqueUsers.size.toLocaleString() + '</span></div>' +
      '<div class="geo-row lvl-district"><span class="geo-name">Total Ad Views</span><span class="geo-val">' + totalViews.toLocaleString() + '</span></div>' +
      '<div class="geo-row lvl-district"><span class="geo-name">Estimated User Earnings (views × ₹0.70)</span><span class="geo-val">₹' + estimatedEarnings.toFixed(2) + '</span></div>' +
      '<div class="rev-note">Matched by each view\'s recorded location against ' + state + ' and its known districts — users who never shared a location, or whose location text doesn\'t match, won\'t be counted here.</div>';
  } catch(e){
    console.error('user table error:', e);
    treeEl.innerHTML = '<div style="text-align:center;color:#c62828;padding:20px;font-size:12px;">Couldn\'t load data — please try again.</div>';
  }
}

async function refreshRevenueTable(period){
  const treeEl = document.getElementById("districtTree");
  document.getElementById("stateLabel").textContent = (type === "vendor" ? "Vendor Report — " : "Company Report — ") + state;
  treeEl.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;font-size:12px;">Loading…</div>';

  let fromDate = periodToFromDate(period);
  if(period === "Date Range"){
    const df = document.getElementById("dateFrom").value;
    fromDate = df ? new Date(df) : null;
  }

  try {
    const { data: campaigns, error } = await supabaseClient.from('campaigns').select('*');
    if(error) throw error;

    const matched = (campaigns || []).filter(function(c){
      if(!matchesState(c.location, state)) return false;
      if(fromDate && c.created_at && new Date(c.created_at) < fromDate) return false;
      return true;
    });

    const ids = matched.map(function(c){ return c.id; });

      if(!vErr && views){

  }
}

   Same matchesState() location-text heuristic as vendor/company, filtered

async function refreshAdCategoryTable(period){

  }

    const { data: campaigns, error } = await supabaseClient
      .from('campaigns').select('title, location, created_at')
      .eq('type', AD_CATEGORY_TYPES[type]).eq('status', 'Active');

    const matched = (campaigns || []).filter(function(c){

    });
    currentAdCategoryRows = matched;

    document.getElementById("stateTotal").textContent = matched.length + " ads";
    treeEl.innerHTML = matched.length
      ? matched.map(function(c){
          return '<div class="geo-row lvl-place"><span class="geo-name">' + (c.title || "Untitled") + '</span><span class="geo-val">' + fmtDateTime(c.created_at) + '</span></div>';
        }).join("") + '<div class="rev-note">Matched by location text against ' + state + ' and its known districts — may miss ads posted with a town/mandal name not in that list.</div>'
      : '<div style="text-align:center;color:#aaa;padding:16px;font-size:12px;">No ' + metricTitle + ' found for this state in this period.</div>';
  } catch(e){
    console.error('ad category table error:', e);
    treeEl.innerHTML = '<div style="text-align:center;color:#c62828;padding:20px;font-size:12px;">Couldn\'t load data — please try again.</div>';
  }
}

function refresh(period){
  currentPeriod = period;
  refreshGeoTree(period);
  if(IS_REVENUE_TYPE){
    refreshRevenueTable(period);
  } else if(IS_USER_TYPE){
    refreshUserTable(period);
  } else if(IS_ADCAT_TYPE){
    refreshAdCategoryTable(period);
  } else {
    // Unknown/unexpected type — every real linking page sends type=vendor/user/company/
    // frame/video/survey, so this shouldn't be reachable. No fake numbers as a fallback.
    document.getElementById("stateLabel").textContent = metricTitle + " — Districts";
    document.getElementById("stateTotal").textContent = "—";
    document.getElementById("districtTree").innerHTML = '<div style="text-align:center;color:#aaa;padding:16px;font-size:12px;">Unknown data type — no real data source for this yet.</div>';
  }
}

initPeriodSelector(periodRow, refresh, dateRangeRow);
refresh(currentPeriod);

document.getElementById("downloadBtn").onclick = ()=>{
  if(IS_REVENUE_TYPE){
    const headers = type === "vendor"
      ? ["S.no","Vendor Name","Contact","Location","Ad Posted","Target Users","Paid Amount","Viewers","Utilized Amount","Balance","Company Profit (30%)","Govt Tax (GST)"]
      : ["S.no","Vendor Name","Ad Type","Ad Posted","Target Users","Paid Amount","Viewers","Utilized Amount","Balance","User Profit (70%)","Company Profit (30%)","Govt Tax (GST)"];
    const rows = currentRevenueRows.map(function(r){
      return type === "vendor"
        ? [r.sno, r.vendorName, r.vendorContact, r.vendorLocation, r.posted, r.target, r.paidAmount ?? "", r.viewers, r.utilizedAmount, r.balance ?? "", r.companyProfit, r.govtTax]
        : [r.sno, r.vendorName, r.adType, r.posted, r.target, r.paidAmount ?? "", r.viewers, r.utilizedAmount, r.balance ?? "", r.userProfit, r.companyProfit, r.govtTax];
    });
    downloadCSV(type + "_" + state.replace(/\s+/g,"_") + "_" + currentPeriod.replace(/\s+/g,"_") + ".csv", headers, rows);
  } else if(IS_USER_TYPE){
    const headers = ["Viewer Mobile","Viewer Location","Viewed At"];
    const rows = currentUserViews.map(function(v){
      return [v.viewer_mobile || "—", v.viewer_location || "—", v.created_at || "—"];
    });
    downloadCSV(type + "_" + state.replace(/\s+/g,"_") + "_" + currentPeriod.replace(/\s+/g,"_") + ".csv", headers, rows);
  } else if(IS_ADCAT_TYPE){
    const headers = ["Title","Location","Posted"];
    const rows = currentAdCategoryRows.map(function(c){
      return [c.title || "Untitled", c.location || "—", c.created_at || "—"];
    });
    downloadCSV(type + "_" + state.replace(/\s+/g,"_") + "_" + currentPeriod.replace(/\s+/g,"_") + ".csv", headers, rows);
  }
  // Unknown type: nothing real to export here — use the "Download District
  // Breakdown" button above instead, which always has real data.
};
</script>
