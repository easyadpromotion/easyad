<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://ofluxzckhnydqgwtzjth.supabase.co";
      const SUPABASE_KEY = "sb_publishable_qx2bXh00tGoDTrYjhl9Wcg_J9XKdQts";
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>
    <style>
:root{
  --dark:#2d3436;
  --bg:#f0f2f5;
  --purple:#6c3ce9;
  --red:#d63031;
  --orange:#e67e22;
  --green:#2e7d32;
  --muted:#888;
  --text:#333;
}
*{ box-sizing:border-box; }
body{
  font-family:'Poppins', sans-serif; background:#2d3436;
  margin:0; padding:20px; display:flex; justify-content:center; min-height:100vh;
}
.mobile-screen{
  width:100%; max-width:380px; min-height:100vh;
  background:var(--bg); border:8px solid #444; border-radius:40px;
  box-shadow:0 30px 60px rgba(0,0,0,0.5), 0 0 0 2px #2d3436;
  display:flex; flex-direction:column;
  box-sizing:border-box; position:relative; overflow:hidden;
}
.header{
  background:var(--dark); padding:22px 20px; color:#fff;
  border-radius:0 0 20px 20px; box-shadow:0 4px 10px rgba(0,0,0,0.1);
  display:flex; align-items:center; gap:12px;
}
.back-btn{
  background:rgba(255,255,255,0.15); width:34px; height:34px; border-radius:10px;
  display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none;
  font-size:16px; font-weight:700; flex-shrink:0; border:none; cursor:pointer;
}
.header-title{ font-size:18px; font-weight:700; }

.search-wrap{ padding:16px 20px 4px; }
.search-box{
  width:100%; padding:11px 14px; border-radius:14px; border:1px solid #e2e2e2;
  font-family:inherit; font-size:13px; background:#fff; outline:none;
}
.search-box:focus{ border-color:var(--purple); }

.content{ flex:1; overflow-y:auto; padding:12px 20px 30px; }
.content::-webkit-scrollbar{ display:none; }

.empty-state{ text-align:center; color:#aaa; font-size:12px; margin-top:40px; }

.user-card{
  background:#fff; border-radius:16px; padding:14px; margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}
.uc-top{ display:flex; align-items:flex-start; gap:12px; }
.uc-avatar{
  width:42px; height:42px; border-radius:50%; background:#ece3fb; color:var(--purple);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;
}
.uc-name-wrap{ flex:1; min-width:0; }
.uc-name{ font-size:14px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.uc-mobile{ font-size:11.5px; color:#666; margin-top:2px; }
.uc-wallet{ font-size:11px; color:var(--muted); margin-top:2px; }

.badge{ font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:10px; }
.badge-active{ background:#e8f5e9; color:var(--green); }
.badge-blocked{ background:#ffebee; color:var(--red); }
.badge-hold{ background:#fff3e0; color:var(--orange); }
.badge-incomplete{ background:#eceff1; color:#607d8b; }

.uc-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:8px 10px;
  margin:12px 0 4px; padding-top:12px; border-top:1px dashed #eee;
}
.uc-span2{ grid-column:1 / -1; }
.uc-lbl{ display:block; font-size:9px; font-weight:700; text-transform:uppercase; color:#aaa; letter-spacing:0.3px; }
.uc-val{ display:block; font-size:12px; color:var(--text); margin-top:2px; word-break:break-word; }

.uc-actions{ display:flex; gap:8px; margin-top:12px; }
.uc-btn{
  flex:1; padding:9px 0; border-radius:12px; border:1.5px solid #e2e2e2; background:#fff;
  font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
}
.btn-block{ color:var(--red); border-color:#ffcdd2; }
.btn-unblock{ color:var(--green); border-color:#c8e6c9; }
.btn-hold{ color:var(--orange); border-color:#ffe0b2; }
.btn-unhold{ color:var(--purple); border-color:#d8cffa; }

.toast{
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
  background:#222; color:#fff; padding:9px 20px; border-radius:20px; font-size:12px; font-weight:600;
  z-index:999; white-space:nowrap; opacity:0; transition:opacity 0.3s; pointer-events:none;
}
.toast.show{ opacity:1; }

@media (max-width:400px){
  body{ padding:0; }
  .mobile-screen{ border-radius:0; border:none; min-height:100vh; }
}
    </style>
</head>
<body>

<div class="mobile-screen">

    <div class="header">
        <button class="back-btn" onclick="window.location.href='admin_dashboard.html'">←</button>
        <div class="header-title">User Management</div>
    </div>

    <div class="search-wrap">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search Users...">
    </div>

    <div class="content" id="userList">
        <div class="empty-state">Loading users…</div>
    </div>

    <div class="toast" id="toast"></div>

</div>

<script>
/* ============================================================
   Real data from Supabase `users`. DOB / Gender / Profession /
   Specific Role / Location / Registered At / Blocked / On Hold
   require the ALTER TABLE migration shared alongside this file —
   until that's run, those columns come back undefined and show as
   "—", and the Block/Hold buttons will fail with a clear toast
   instead of silently doing nothing.
   ============================================================ */

let allUsers = [];

function initials(first, last){
  const s = ((first || "").charAt(0) + (last || "").charAt(0)).toUpperCase();
  return s || "U";
}

function fmtField(v){
  return (v === null || v === undefined || v === "") ? "—" : v;
}

function fmtDOB(v){
  if(!v) return "—";
  const d = new Date(v);
  if(isNaN(d)) return v;
  return d.toLocaleDateString();
}

function fmtDateTime(v){
  if(!v) return "—";
  const d = new Date(v);
  if(isNaN(d)) return v;
  return d.toLocaleDateString() + ", " + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// Same "incomplete" definition as home.html's updateProfileNudge — missing
// any field only the full registration flow collects. These users are real
// (mobile + city from ensure_user_exists), just mid-signup, so don't read
// the blank fields below as a load failure.
function isIncomplete(u){
  return !u.dob || !u.gender || !u.profession || !u.specific_role;
}

function statusBadges(u){
  let html = "";
  if(u.blocked) html += '<span class="badge badge-blocked">Blocked</span>';
  if(u.on_hold) html += '<span class="badge badge-hold">On Hold</span>';
  if(!u.blocked && !u.on_hold) html += '<span class="badge badge-active">Active</span>';
  if(isIncomplete(u)) html += '<span class="badge badge-incomplete">Incomplete Profile</span>';
  return html;
}

function renderUsers(list){
  const container = document.getElementById("userList");
  if(!list.length){
    container.innerHTML = '<div class="empty-state">No users found.</div>';
    return;
  }

  container.innerHTML = list.map(function(u){
    const name = ((u.first_name || "") + " " + (u.last_name || "")).trim() || "Unnamed User";
    return `
      <div class="user-card">
        <div class="uc-top">
          <div class="uc-avatar">${initials(u.first_name, u.last_name)}</div>
          <div class="uc-name-wrap">
            <div class="uc-name">${name} ${statusBadges(u)}</div>
            <div class="uc-mobile">${fmtField(u.mobile)}</div>
            <div class="uc-wallet">Wallet: ₹${parseFloat(u.wallet || 0).toFixed(2)}</div>
          </div>
        </div>
        <div class="uc-grid">
          <div><span class="uc-lbl">DOB</span><span class="uc-val">${fmtDOB(u.dob)}</span></div>
          <div><span class="uc-lbl">Gender</span><span class="uc-val">${fmtField(u.gender)}</span></div>
          <div><span class="uc-lbl">Profession</span><span class="uc-val">${fmtField(u.profession)}</span></div>
          <div><span class="uc-lbl">Specific Role</span><span class="uc-val">${fmtField(u.specific_role)}</span></div>
          <div class="uc-span2"><span class="uc-lbl">Location</span><span class="uc-val">${fmtField(u.city)}</span></div>
          <div class="uc-span2"><span class="uc-lbl">Registered</span><span class="uc-val">${fmtDateTime(u.registered_at)}</span></div>
        </div>
        <div class="uc-actions">
          <button class="uc-btn ${u.blocked ? "btn-unblock" : "btn-block"}" onclick="toggleBlock('${u.mobile}', ${!u.blocked})">${u.blocked ? "Unblock" : "Block"}</button>
          <button class="uc-btn ${u.on_hold ? "btn-unhold" : "btn-hold"}" onclick="toggleHold('${u.mobile}', ${!u.on_hold})">${u.on_hold ? "Release Hold" : "Hold"}</button>
        </div>
      </div>
    `;
  }).join("");
}

function currentFiltered(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  if(!q) return allUsers;
  return allUsers.filter(function(u){
    const name = ((u.first_name || "") + " " + (u.last_name || "")).toLowerCase();
    const mobile = String(u.mobile || "");
    return name.indexOf(q) !== -1 || mobile.indexOf(q) !== -1;
  });
}

async function loadUsers(){
  document.getElementById("userList").innerHTML = '<div class="empty-state">Loading users…</div>';
  try{
    const { data, error } = await supabaseClient.from('users').select('*').order('mobile', { ascending: true });
    if(error) throw error;
    allUsers = data || [];
    renderUsers(currentFiltered());
  }catch(e){
    console.error('load users error:', e);
    document.getElementById("userList").innerHTML = '<div class="empty-state">Couldn\'t load users — please try again.</div>';
  }
}

async function toggleBlock(mobile, newVal){
  try{
    const { error } = await supabaseClient.from('users').update({ blocked: newVal }).eq('mobile', mobile);
    if(error) throw error;
    const u = allUsers.find(function(x){ return x.mobile === mobile; });
    if(u) u.blocked = newVal;
    renderUsers(currentFiltered());
    showToast(newVal ? "User blocked" : "User unblocked");
  }catch(e){
    console.error('toggleBlock error:', e);
    showToast("Couldn't update — has the `blocked` column been added to `users` yet?");
  }
}

async function toggleHold(mobile, newVal){
  try{
    const { error } = await supabaseClient.from('users').update({ on_hold: newVal }).eq('mobile', mobile);
    if(error) throw error;
    const u = allUsers.find(function(x){ return x.mobile === mobile; });
    if(u) u.on_hold = newVal;
    renderUsers(currentFiltered());
    showToast(newVal ? "User put on hold" : "Hold released");
  }catch(e){
    console.error('toggleHold error:', e);
    showToast("Couldn't update — has the `on_hold` column been added to `users` yet?");
  }
}

document.getElementById("searchInput").addEventListener("input", function(){
  renderUsers(currentFiltered());
});

function showToast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2500);
}

loadUsers();
</script>
</body>
</html>
